<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 활용역량 로드맵</title>
<meta name="description" content="AI를 답을 얻는 도구에서 역량을 확장하는 도구로. 나의 AI 활용역량을 진단하고 7일 Challenge로 실행해보세요.">
<style>
  :root{
    --bg:#F6F7F9;
    --surface:#FFFFFF;
    --border:#E4E7EC;
    --text:#1B1F27;
    --text-2:#5B6270;
    --text-3:#8A90A0;
    --accent:#3D5AFE;
    --accent-weak:#EDF0FF;
    --accent-ink:#2A3FCC;
    --success:#1F9D6C;
    --success-weak:#E7F7EF;
    --danger:#D7473D;
    --radius:14px;
    --radius-sm:9px;
    --shadow:0 1px 2px rgba(20,24,34,.04), 0 4px 14px rgba(20,24,34,.05);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    word-break:keep-all;
  }
  button,input,textarea{font-family:inherit}
  h1,h2,h3{margin:0 0 8px;line-height:1.35;font-weight:800}
  p{margin:0 0 12px;color:var(--text-2)}
  ul,ol{margin:0;padding:0}
  a{color:var(--accent)}

  .page{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
  .content{padding:16px 16px 8px}

  /* ---- Topbar ---- */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.92);backdrop-filter:saturate(180%) blur(6px);border-bottom:1px solid var(--border);padding:10px 12px}
  .tb-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .tb-back{width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .tb-back:hover{background:var(--border)}
  .tb-back-ph{width:32px;height:32px;display:inline-block}
  .tb-title{font-weight:700;font-size:15px;text-align:center;flex:1}
  .tb-progress{height:4px;background:var(--border);border-radius:2px;margin-top:10px;overflow:hidden}
  .tb-progress-fill{height:100%;background:var(--accent);transition:width .25s ease}
  .tb-progress-label{margin-top:4px;font-size:11px;color:var(--text-3);text-align:right}

  /* ---- Card ---- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card h2{font-size:19px}
  .card h3{font-size:15px;margin-top:4px}

  /* ---- Buttons ---- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .06s ease,opacity .15s ease;text-decoration:none}
  .btn:active{transform:scale(.98)}
  .btn-block{width:100%;display:flex}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-ink)}
  .btn-primary[disabled]{background:#C7CEEB;cursor:not-allowed}
  .btn-secondary{background:var(--accent-weak);color:var(--accent-ink)}
  .btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border)}
  .btn-danger{background:#FBEAE9;color:var(--danger)}
  .btn-row{display:flex;gap:10px}
  .btn-row .btn{flex:1}
  .btn-row.wrap{flex-wrap:wrap}
  .btn-row.wrap .btn{flex:1 1 auto}

  /* ---- Landing ---- */
  .hero{padding:28px 4px 8px}
  .eyebrow{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.02em;margin-bottom:10px}
  .hero h1{font-size:24px;letter-spacing:-.01em}
  .hero-sub{font-size:15px;margin-top:10px}
  .hint{text-align:center;font-size:12px;color:var(--text-3);margin:10px 0 16px}
  .flow{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 4px 20px}
  .flow-step{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
  .flow-num{width:24px;height:24px;border-radius:50%;background:var(--accent-weak);color:var(--accent-ink);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
  .flow-title{font-weight:800;font-size:14px;margin-bottom:4px}
  .flow-desc{font-size:12.5px;color:var(--text-2)}

  /* ---- Scale / quiz ---- */
  .scale-legend{display:flex;flex-direction:column;gap:6px;margin:14px 0 18px;padding:12px;background:var(--bg);border-radius:var(--radius-sm)}
  .sl-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
  .sl-num{width:20px;height:20px;border-radius:50%;background:var(--accent-weak);color:var(--accent-ink);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .quiz-card{padding-top:22px}
  .quiz-tag{display:inline-block;font-size:12px;font-weight:800;color:var(--accent-ink);background:var(--accent-weak);padding:4px 10px;border-radius:999px;margin-bottom:12px}
  .quiz-q{font-size:19px;margin-bottom:18px}
  .scale-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
  .scale-opts.row{flex-direction:row}
  .scale-opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1.5px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer}
  .scale-opt.sm{flex:1;flex-direction:column;padding:10px 6px;gap:4px;justify-content:center}
  .scale-opt-num{width:26px;height:26px;border-radius:50%;background:var(--bg);color:var(--text-2);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .scale-opt-label{font-size:14px}
  .scale-opt.selected{border-color:var(--accent);background:var(--accent-weak)}
  .scale-opt.selected .scale-opt-num{background:var(--accent);color:#fff}

  /* ---- 개인화 폼 ---- */
  .field-label{display:block;font-size:13px;font-weight:700;margin:14px 0 8px;color:var(--text)}
  .text-input{width:100%;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;font-size:14px;resize:vertical;background:var(--surface);color:var(--text)}
  .text-input:focus{outline:none;border-color:var(--accent)}
  .chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .chip-opt{border:1.5px solid var(--border);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:13px;cursor:pointer;color:var(--text-2)}
  .chip-opt.selected{border-color:var(--accent);background:var(--accent-weak);color:var(--accent-ink);font-weight:700}
  .muted{color:var(--text-3)}
  .muted.small{font-size:12.5px}

  /* ---- 결과 화면 ---- */
  .participant-card{text-align:center}
  .participant-label{font-size:12px;color:var(--text-3);font-weight:700}
  .participant-id{font-size:26px;font-weight:800;letter-spacing:.03em;color:var(--accent-ink);margin:6px 0 10px}
  .level-card{text-align:center;background:linear-gradient(180deg,var(--accent-weak),var(--surface))}
  .level-eyebrow{font-size:13px;color:var(--text-2)}
  .level-badge{display:inline-block;font-size:22px;font-weight:800;color:var(--accent-ink);margin:6px 0 2px}
  .level-badge.small{font-size:13px;background:var(--accent-weak);color:var(--accent-ink);padding:5px 10px;border-radius:999px;display:inline-block;margin-bottom:6px}
  .level-name{font-size:16px;font-weight:800;margin-bottom:10px}

  .dim-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .dim-label{width:40px;font-size:13px;font-weight:700;color:var(--text-2);flex:0 0 auto}
  .dim-bar{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
  .dim-bar-fill{height:100%;background:var(--accent);border-radius:6px}
  .dim-score{width:32px;text-align:right;font-size:13px;font-weight:800;flex:0 0 auto}

  .growth-card{background:var(--accent-weak);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px}
  .growth-card.strength-card{background:var(--success-weak)}
  .growth-dim{font-weight:800;font-size:14px;margin-bottom:4px;color:var(--accent-ink)}
  .strength-card .growth-dim{color:var(--success)}
  .growth-card p{margin:0;font-size:13.5px;color:var(--text)}
  .fine-print{font-size:11.5px;color:var(--text-3);margin-top:10px}
  .fine-print.center{text-align:center}

  /* ---- Roadmap ---- */
  .roadmap-head{text-align:center}
  .roadmap-progress-label{font-size:15px;font-weight:700;margin:10px 0 2px;color:var(--text)}
  .challenge-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .challenge-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
  .cc-body{flex:1;min-width:0}
  .cc-title{font-weight:700;font-size:14.5px;margin-bottom:3px}
  .cc-meta{font-size:12px;color:var(--text-3)}
  .cc-arrow{font-size:20px;color:var(--text-3);flex:0 0 auto}

  .dashboard-card{text-align:center}
  .db-emoji{font-size:26px;margin-bottom:6px}
  .reward-note{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;background:var(--bg);border-radius:999px;padding:8px 12px;margin:10px 0;color:var(--text-2)}

  /* ---- Challenge 상세 ---- */
  .challenge-goal{font-size:14px;color:var(--text)}
  .step-list{list-style:none;counter-reset:none;display:flex;flex-direction:column;gap:10px;margin:10px 0 16px}
  .step-list li{display:flex;gap:10px;font-size:14px;align-items:flex-start}
  .step-num{width:22px;height:22px;border-radius:50%;background:var(--accent-weak);color:var(--accent-ink);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
  .output-box{background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px;font-size:13.5px}
  .action-card{text-align:center}

  /* ---- 만족도 조사 ---- */
  .survey-item{margin-bottom:6px}
  .satisfaction-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px;border-bottom:1px solid var(--border)}
  .satisfaction-row:last-child{border-bottom:none}
  .reward-card{text-align:center}

  /* ---- 개발자 도구 ---- */
  .raw-json{background:var(--bg);border-radius:var(--radius-sm);padding:12px;font-size:11px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;color:var(--text-2)}
  code{background:var(--bg);padding:2px 5px;border-radius:4px;font-size:12px}

  /* ---- About / Footer ---- */
  .about{padding:22px 18px 10px;border-top:1px solid var(--border);margin-top:18px}
  .about h3{font-size:13px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
  .about p{font-size:12.5px}
  .sources{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-direction:column;gap:6px}
  .sources li{font-size:12px;color:var(--text-3)}
  .bottom-space{padding:6px 18px 30px;text-align:right}
  .dev-link{font-size:10px;color:var(--text-3);opacity:.5;text-decoration:none}

  @media (max-width:380px){
    .hero h1{font-size:21px}
    .flow{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="challenges.js"></script>
<script src="logic.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
